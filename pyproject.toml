[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-delegate"
version = "1.0.0"
description = "MCP server that delegates coding and research tasks to Google Antigravity sub-agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Thulnith" }]
keywords = ["mcp", "antigravity", "claude", "agent", "delegation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = ["fastmcp>=3.4.7,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/Thulnith-0/antigravity-delegate"
Issues = "https://github.com/Thulnith-0/antigravity-delegate/issues"

[tool.setuptools]
py-modules = ["antigravity_delegate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
